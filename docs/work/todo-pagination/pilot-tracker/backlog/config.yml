project_name: "Todo pagination pilot"
default_status: "To Do"
statuses: ["To Do", "Blocked", "Ready", "In Progress", "Done"]
types: ["bug", "feature", "maintenance", "spike"]
labels: []
date_format: "yyyy-mm-dd"
max_column_width: 20
auto_open_browser: true
default_port: 6420
browser_hostname: "127.0.0.1"
remote_operations: false
auto_commit: false
filesystem_only: true
bypass_git_hooks: false
check_active_branches: false
active_branch_days: 30
task_prefix: "task"
